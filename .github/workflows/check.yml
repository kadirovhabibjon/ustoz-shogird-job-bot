name: Xodim kerak tekshiruvi

# Har bir ishga tushirish ~5,5 soat davomida kanalni har daqiqada tekshiradi,
# tugagach keyingi ishga tushirishni o'zi boshlaydi (zanjir).
# To'xtatish: Actions → shu workflow → "Disable workflow".
on:
  schedule:
    - cron: "23 * * * *" # zaxira: zanjir uzilib qolsa, qayta tiklaydi
  push:
    branches: [main]
    paths:
      - "check.py"
      - "main.py"
      - "matcher.py"
      - "profile.json"
      - "requirements.txt"
      - ".github/workflows/check.yml"
  workflow_dispatch:
    inputs:
      test:
        description: "Sizga mos oxirgi 'Xodim kerak' postini darhol yuborish"
        type: boolean
        default: false

# Bir vaqtda faqat bitta zanjir ishlaydi; yangi ishga tushirish navbatda kutadi.
# Yangi kod yuklanganda (push) eskisi to'xtatilib, yangi kod darhol ishga tushadi.
concurrency:
  group: check
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read
  actions: write # keyingi ishga tushirishni boshlash uchun

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Oxirgi ko'rilgan post ID si ishga tushishlar orasida keshda saqlanadi
      - name: Holatni tiklash
        uses: actions/cache/restore@v6
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Kanalni kuzatish
        run: python check.py --loop ${{ inputs.test && '--test' || '' }}
        env:
          PYTHONUNBUFFERED: "1"
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Holatni saqlash
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v6
        with:
          path: state.json
          key: state-${{ github.run_id }}

      # Qo'lda bekor qilinsa, zanjir to'xtaydi
      - name: Keyingi ishga tushirishni boshlash
        if: ${{ !cancelled() }}
        run: gh workflow run check.yml --repo "${{ github.repository }}" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
