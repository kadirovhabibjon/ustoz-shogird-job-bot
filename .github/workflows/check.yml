name: Xodim kerak tekshiruvi

on:
  schedule:
    - cron: "*/5 * * * *" # har 5 daqiqada (GitHub ba'zan kechiktiradi)
    - cron: "17 6 * * 1" # har dushanba: workflow o'chib qolmasligi uchun (keepalive)
  push:
    branches: [main]
    paths:
      - "check.py"
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/check.yml"
  workflow_dispatch:
    inputs:
      test:
        description: "Oxirgi 'Xodim kerak' postini darhol yuborish"
        type: boolean
        default: false

# Bir vaqtda faqat bitta tekshiruv ishlaydi
concurrency:
  group: check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Oxirgi ko'rilgan post ID si ishga tushishlar orasida keshda saqlanadi
      - name: Holatni tiklash
        uses: actions/cache/restore@v6
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Kanalni tekshirish
        run: python check.py ${{ inputs.test && '--test' || '' }}
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Holatni saqlash
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v6
        with:
          path: state.json
          key: state-${{ github.run_id }}

  # GitHub 60 kun faolsiz repodagi jadvalni o'chiradi; har hafta qayta yoqib turamiz
  keepalive:
    if: github.event.schedule == '17 6 * * 1'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/check.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
