name: Xodim kerak tekshiruvi

on:
  schedule:
    - cron: "*/5 * * * *" # har 5 daqiqada (GitHub ba'zan kechiktiradi)
  workflow_dispatch:
    inputs:
      test:
        description: "Oxirgi 'Xodim kerak' postini darhol yuborish"
        type: boolean
        default: false

# Bir vaqtda faqat bitta tekshiruv ishlaydi
concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Oxirgi ko'rilgan post ID si ishga tushishlar orasida keshda saqlanadi
      - name: Holatni tiklash
        uses: actions/cache/restore@v6
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Kanalni tekshirish
        run: python check.py ${{ inputs.test && '--test' || '' }}
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TG_SESSION: ${{ secrets.TG_SESSION }}

      - name: Holatni saqlash
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v6
        with:
          path: state.json
          key: state-${{ github.run_id }}
